name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, unit tests, and CLI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-tested.txt

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install tested dependencies and lint tool
        run: |
          python -m pip install -r requirements-tested.txt
          python -m pip install "ruff>=0.12,<1"
          python -m pip check

      - name: Check lint and formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Run unit tests
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: python -m unittest discover -s tests -v

      - name: Run end-to-end CLI smoke test
        run: python scripts/smoke_test.py
