[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arian-lstm-language-model"
version = "0.1.0"
description = "Word-level WikiText-2 language modeling and text generation with PyTorch LSTMs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Arian Abdollahi"}]
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<3", "gensim>=4.4,<5", "tqdm>=4.66,<5"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "matplotlib>=3.8,<4"]
dev = ["ruff>=0.12,<1"]

[project.urls]
Repository = "https://github.com/Arian-Abdollahi/lstm-language-model"
Notebook = "https://www.kaggle.com/code/arianabdollahi/language-model-with-lstm"

[project.scripts]
lm-train = "lstm_language_model.train:main"
lm-evaluate = "lstm_language_model.evaluate:main"
lm-generate = "lstm_language_model.generate:main"
lm-inspect = "lstm_language_model.analyze:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
